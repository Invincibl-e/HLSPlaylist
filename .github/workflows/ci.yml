name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run official HTTP/2 and connected iOS device verification
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full verification (official tools + iOS device)
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: [self-hosted, macOS, hls-device]
    timeout-minutes: 90
    env:
      HLS_APPLE_BIN: ${{ vars.HLS_APPLE_BIN }}
      HLS_DEVICE_HELPER: ${{ vars.HLS_DEVICE_HELPER }}
      HLS_DEVICE_SSH_PORT: ${{ vars.HLS_DEVICE_SSH_PORT }}
      HLS_SSH_CONTROL: ${{ vars.HLS_SSH_CONTROL }}
      HLS_DEVICE_UDID: ${{ vars.HLS_DEVICE_UDID }}
      HLS_TLS_IDENTITY: ${{ vars.HLS_TLS_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - name: Full profile (missing prerequisites fail)
        run: python3 Verification/suite.py --profile full
      - name: Preserve full verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hls-full-verification
          path: Verification/results/suite-*
          if-no-files-found: error

  test:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Explicit Intel labels avoid the macos-15 ARM runner capacity failures.
        os: [macos-15-intel, macos-26-intel]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Standards, ASan, corpus, properties and harness failure gates
        run: python3 Verification/suite.py
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hls-verification-${{ matrix.os }}
          path: Verification/results/suite-*
          if-no-files-found: error

  cocoapods:
    name: CocoaPods (iOS, macOS)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Lint and build pod
        run: pod lib lint HLSPlaylist.podspec --platforms=ios,osx

  platforms:
    name: Build (iOS, tvOS)
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Build for iOS
        run: xcodebuild build -scheme HLSPlaylist -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build for tvOS
        run: xcodebuild build -scheme HLSPlaylist -destination 'generic/platform=tvOS Simulator' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO -quiet
