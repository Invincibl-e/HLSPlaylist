name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: swift test

  cocoapods:
    name: CocoaPods (iOS, macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Lint and build pod
        run: pod lib lint HLSPlaylist.podspec --platforms=ios,osx

  platforms:
    name: Build (iOS, tvOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Build for iOS
        run: xcodebuild build -scheme HLSPlaylist -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build for tvOS
        run: xcodebuild build -scheme HLSPlaylist -destination 'generic/platform=tvOS Simulator' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO -quiet
